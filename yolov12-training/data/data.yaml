# YOLO dataset descriptor for the NXP Cup 2026 dataset (Roboflow YOLOv12 export).
#
# The scripts (train.py / validate.py) resolve `path` relative to THIS yaml file
# and rewrite it to an absolute path at runtime, so the relative path below works
# from anywhere. If you move the dataset, just fix `path`.
#
# Dataset facts (verified): 2167 imgs @ 512x512, splits already made, 9 classes,
# objects are TINY (median ~18x15 px) — keep the training/inference size high.

path: ../dataset/NXPCUP_2026.v2-v1_a.yolov12   # dataset root, relative to this file
train: train/images
val: valid/images
test: test/images

# --- classes (output size = 9) ---------------------------------------------
# Order MUST match the label class ids (0..8). Do not reorder.
nc: 9
names:
  0: A
  1: B
  2: C
  3: Left
  4: Right
  5: Straight
  6: X
  7: Y
  8: Z
